name: Sourceday
description: 'SourceDay is an AI-driven supplier collaboration and purchase order (PO)
  management platform for manufacturers and distributors. It synchronizes buyers,
  suppliers, and ERP systems in real time to prevent supply chain disruptions, automating
  PO change management, shipment visibility, supplier scorecards, and request-for-quote
  (RFQ) workflows. SourceDay reports managing more than $5B in quarterly direct spend
  across 100K+ activated suppliers, with 500+ certified ERP integrations spanning Acumatica,
  Epicor (Kinetic and Prophet 21), Infor, and NetSuite. Integration is delivered through
  certified ERP connectors rather than a public self-serve developer API; there is
  no public API documentation, developer portal, or published OpenAPI at this time.'
